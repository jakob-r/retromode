services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retromode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retromode}
      POSTGRES_DB: ${POSTGRES_DB:-retromode}
    # Host port for local dev (`make postgres`); bound to localhost so it stays off the public net.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-retromode} -d ${POSTGRES_DB:-retromode}']
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-retromode}:${POSTGRES_PASSWORD:-retromode}@postgres:5432/${POSTGRES_DB:-retromode}
      ACME_WEBROOT: /acme
      VIRTUAL_HOST: ${VIRTUAL_HOST:-}
      VIRTUAL_PORT: ${BACKEND_PORT:-3000}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-${VIRTUAL_HOST:-}}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - acme-webroot:/acme:ro
    # Optional localhost-only debug port. Public HTTP/HTTPS is the existing nginx-proxy.
    ports:
      - '127.0.0.1:${APP_PORT:-8081}:${BACKEND_PORT:-3000}'
    networks:
      - default
      - proxy-tier
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    profiles: ['app']

volumes:
  postgres-data:
  acme-webroot:
    name: ${PROXY_HTML_VOLUME:-docker_compose_html}
    external: true

networks:
  proxy-tier:
    name: ${PROXY_NETWORK:-docker_compose_proxy-tier}
    external: true
