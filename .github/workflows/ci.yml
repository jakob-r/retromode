name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://retromode:retromode@localhost:5432/retromode
  TEST_DATABASE_URL: postgres://retromode:retromode@localhost:5432/retromode_test

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retromode
          POSTGRES_PASSWORD: retromode
          POSTGRES_DB: retromode
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retromode -d retromode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: pnpm lint
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retromode
          POSTGRES_PASSWORD: retromode
          POSTGRES_DB: retromode
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retromode -d retromode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Migrate database
        run: pnpm --filter backend db:migrate
      - name: Run Playwright
        run: pnpm --filter frontend e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
